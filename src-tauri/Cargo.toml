[package]
name = "nterminal"
version = "0.2.1"
description = "N-Terminal - gruplanabilir sekmeli terminal"
authors = ["Nurullah YAYAN"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "nterminal_lib"
crate-type = ["rlib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
dirs = "6.0.0"
parking_lot = "0.12.5"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# tray-icon: menu cubugu / bildirim alani simgesi.
# image-png: tepsi simgesi PNG olarak gomulu (Image::from_bytes).
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
uuid = { version = "1.20.0", features = ["v4", "serde"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

# session_end_tests.rs: oturum sonu yakalamasi Tauri'nin GERCEK tao dongusuyle
# sinaniyor (`tauri_runtime_wry::tao`). Surum Tauri'ninkiyle ayni cozuluyor;
# ozellikler kapali, uretim yapisina bir sey eklemiyor.
[target.'cfg(windows)'.dev-dependencies]
tauri-runtime-wry = { version = "2", default-features = false }
