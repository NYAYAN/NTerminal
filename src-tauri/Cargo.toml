[package]
name = "nterminal"
version = "0.3.2"
description = "N-Terminal - gruplanabilir sekmeli terminal"
authors = ["Nurullah YAYAN"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "nterminal_lib"
crate-type = ["rlib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
dirs = "6.0.0"
parking_lot = "0.12.5"
portable-pty = "0.9.0"
# Dosyalarin icinde arama (search.rs). Yeni bir agirlik degil: tauri-utils
# zaten ayni surume bagli, yani derleme grafiginde vardi.
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# tray-icon: menu cubugu / bildirim alani simgesi.
# image-png: tepsi simgesi PNG olarak gomulu (Image::from_bytes).
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
# Uygulama icinden guncelleme (indir, imzayi dogrula, kur). Gerekcesi update.rs.
#
# `~2.12`: 2.13 tauri 2.12 istiyor; "2.12" yazmak Cargo'ya tauri'yi de
# yukseltme izni veriyor ve @tauri-apps/api 2.11 ile surum uyusmazligi
# `tauri build`i durduruyor. tauri yukseltilince bu sinir da kalkar.
#
# native-tls: sertifika isletim sisteminin guven deposundan (Windows'ta
# Schannel, macOS'ta anahtarlik) - kurumsal TLS vekilinin kok sertifikasi orada.
# Varsayilan rustls kendi listesini tasiyip o depoyu yok sayiyor. `zip` yalnizca
# Tauri 1'in sikistirilmis paketleri icin; kapali.
tauri-plugin-updater = { version = "~2.12", default-features = false, features = ["native-tls", "system-proxy"] }
uuid = { version = "1.20.0", features = ["v4", "serde"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

# session_end_tests.rs: oturum sonu yakalamasi Tauri'nin GERCEK tao dongusuyle
# sinaniyor (`tauri_runtime_wry::tao`). Surum Tauri'ninkiyle ayni cozuluyor;
# ozellikler kapali, uretim yapisina bir sey eklemiyor.
[target.'cfg(windows)'.dev-dependencies]
tauri-runtime-wry = { version = "2", default-features = false }
