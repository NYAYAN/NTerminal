# Bağımlılık güncellemeleri otomatik PR olarak gelsin: npm (arayüz), cargo
# (Rust) ve iş akışındaki action sürümleri. Haftada bir, Pazartesi; gürültüyü
# sınırlamak için her ekosistemde en fazla beş açık PR.
#
# Tauri paketleri tek grupta: @tauri-apps/api, @tauri-apps/cli ve eklentiler
# birbirine bağlı sürümleniyor (CLI ile api'nin minor'ı tutmazsa `tauri build`
# duruyor); ayrı ayrı PR'lar tek başına birleştirilemezdi.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns:
          - "@tauri-apps/*"
      xterm:
        patterns:
          - "@xterm/*"
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns:
          - "tauri*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
