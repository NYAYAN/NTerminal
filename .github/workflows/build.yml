# N-Terminal — testler ve dağıtım paketleri (Windows + macOS).
#
# Neden Linux yok: PTY, kabuk entegrasyonu ve pencere süslemeleri Windows ve
# macOS için yazıldı (bkz. src-tauri/src/platform.rs — `Platform::Linux` bir
# destek beyanı değil) ve tauri.conf.json'daki paket türleri (nsis, msi, app,
# dmg) Linux'ta karşılık bulmuyor.
#
# scripts/*.ps1 BURADA kullanılmıyor. O betiklerin tek işi geliştirme
# makinesindeki iki Visual Studio kurulumundan çalışan MSVC toolset'ini seçmek
# (win-env.ps1); runner'da tek toolset var, komutlar doğrudan çağrılıyor.

name: Derleme

# Her dala itmede koşuyor. İş dallarda yapılıyor; yalnızca main'i denetlemek
# haberi dal birleştikten SONRA veriyor, yani düzeltmenin en pahalı olduğu anda.
#
# `pull_request` tetikleyicisi bilerek yok: aynı depodaki bir dal için push ile
# PR iki ayrı koşu (ve iki katı macOS dakikası) demek. Koşu head commit'e bağlı
# olduğu için PR'ın denetimler listesinde yine görünüyor.
on:
  push:
    branches: ["**"]
    # Yayın etiketi artık Actions'ta oluşuyor (aşağıdaki `yayin` işi, main'e
    # itmede). Elle itilen `v*` etiketi de hâlâ yayın yapıyor — sürümle
    # eşleşmesi şartıyla.
    tags: ["v*"]
  # Elle tetiklemek ("Run workflow", main seçili) de yayın yolundan geçiyor:
  # yeni bir commit gerektirmeden, sürümün etiketi yoksa yayınlanıyor.
  workflow_dispatch:

# Aynı dala yeni bir itme gelirse eski koşu iptal edilir: macOS runner'ı pahalı
# ve geçilmiş bir commit'in sonucunun değeri yok.
#
# main HARİÇ: main'deki koşu sonunda yayın yapabiliyor ve `gh release create`
# yarıda kesilirse etiket var ama paketleri eksik bir Release kalır — sonraki
# koşu etiketi görüp yayını atlar, bozuk Release öyle kalırdı. main'de koşular
# sıraya giriyor; yeni koşu, öncekinin oluşturduğu etiketi görüp yayını atlıyor.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  CARGO_TERM_COLOR: always
  # Düşen bir testi CI kütüğünden anlamanın tek yolu yığın izi.
  RUST_BACKTRACE: "1"

jobs:
  # Arayüz testleri jsdom üzerinde koşuyor, platformdan bağımsız: en ucuz
  # runner'da bir kez. Rust testleri gerçek PTY açtığı için aşağıda her iki
  # platformda ayrı koşuyor.
  arayuz:
    name: Arayüz (tip denetimi + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: TypeScript tip denetimi
        run: npx tsc --noEmit

      - name: Arayüz testleri
        run: npx vitest run

  paket:
    name: ${{ matrix.ad }}
    needs: arayuz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # Bir platform düşse de diğerinin sonucu görülsün.
      fail-fast: false
      matrix:
        include:
          # `.sig` ve `.app.tar.gz` yalnizca imza anahtari varken uretiliyor
          # (asagida "Paketle"); yoksa eslesmiyor ve sorun degil —
          # `if-no-files-found` yalnizca HIC dosya yoksa dusuruyor.
          - os: windows-latest
            ad: Windows
            cikti: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.exe.sig
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/msi/*.msi.sig
          - os: macos-latest
            ad: macOS
            cikti: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app.tar.gz
              src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      # Tauri'nin bağımlılık ağacı sıfırdan on dakikanın üzerinde derleniyor;
      # önbellek olmadan her koşu bunu yeniden ödüyor.
      - name: Cargo önbelleği
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.os }}

      - name: Bağımlılıklar
        run: npm ci

      # MSI, Tauri'nin şablonundan değil projenin src-tauri/wix/main.wxs
      # dosyasından üretiliyor; Tauri güncellenip dosya yeniden üretilmezse
      # yeni sürümün şablon düzeltmeleri MSI'a girmez. Aynı denetim vitest'te
      # var ama yukarıdaki arayüz işinde atlanıyor: o iş Linux'ta, WiX
      # şablonu ise yalnızca CLI'nin Windows derlemesinde. Saniyeler sürüyor;
      # uzun Rust adımlarından önce.
      - name: MSI şablonu güncel mi
        if: runner.os == 'Windows'
        run: node scripts/wix-template.mjs --check

      # PTY, kabuk entegrasyonu ve git okuması platforma bağlı; testler bu
      # yüzden paketlemeden ÖNCE ve her iki platformda koşuyor. Entegrasyon
      # testleri gerçek kabuk süreci başlattığı için sıralı. Kabuğunu
      # bulamayan testler (macOS'ta powershell.exe, cmd.exe, Git Bash)
      # kendilerini atlıyor.
      - name: Rust testleri
        working-directory: src-tauri
        run: cargo test -- --test-threads=1

      # `tauri build` önce beforeBuildCommand'ı (npm run build → tsc + vite)
      # koşuyor, sonra release ikilisini derleyip kurucuları üretiyor.
      # Platformda desteklenmeyen paket türleri atlanıyor: Windows'ta nsis+msi,
      # macOS'ta app+dmg çıkıyor.
      #
      # İşletim sistemi imzası YOK: ne Windows sertifikası ne Apple kimliği
      # tanımlı. macOS'ta tarayıcıdan indiren kullanıcı Gatekeeper uyarısı görür.
      #
      # GÜNCELLEME imzası ise ayrı bir şey ve var: `TAURI_SIGNING_PRIVATE_KEY`
      # sırrı tanımlıysa kurucular uygulamanın kendi güncellemesi için de
      # imzalanıyor (`.sig`) ve macOS'a `.app.tar.gz` ekleniyor; uygulama
      # imzayı `tauri.conf.json`daki açık anahtarla doğrulayıp kuruyor (bkz.
      # src-tauri/src/update.rs). Sır yoksa paketler eskisi gibi çıkıyor ve
      # yayın yalnızca HABER veriyor — kurulum düğmesi çıkmıyor.
      #
      # `createUpdaterArtifacts` tauri.conf.json'da değil BURADA açılıyor:
      # orada açık olsaydı anahtarı olmayan her yerel `npm run bundle` imza
      # isteyip düşerdi. Parola sırrı yoksa değişken BOŞ dize oluyor; parolasız
      # anahtar için doğrusu bu — değişken hiç tanımlanmazsa CLI parola sormaya
      # kalkıp terminalsiz ortamda düşüyor (ölçüldü, CLI 2.11).
      #
      # macOS paketi AD-HOC imzalanıyor (`APPLE_SIGNING_IDENTITY: "-"`; Windows
      # bu değişkeni okumuyor). ÖLÇÜLEN (macOS 27, karantinalı kopya): imzasız
      # pakette yalnızca bağlayıcının imzası var, kaynaklar mühürsüz — macOS
      # "hasarlı, Çöp'e taşıyın" diyor ve açmanın TEK yolu Terminal'de `xattr`.
      # Ad-hoc mühürlü pakette uyarı "Apple doğrulayamadı"ya dönüyor ve Sistem
      # Ayarları › Gizlilik ve Güvenlik'te "Yine de Aç" düğmesi çıkıyor:
      # kullanıcı Terminal açmadan, bir kez tıklayarak açıyor. Ücretli Apple
      # Developer ID olmadan gelinebilecek en iyi nokta bu (bkz. README).
      - name: Paketle
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY tanımlı değil: güncelleme paketleri üretilmedi, uygulama bu sürümü kendisi kuramayacak (yalnızca haber verecek)."
            npx tauri build
          fi

      - name: Paketleri yükle
        uses: actions/upload-artifact@v7
        with:
          name: nterminal-${{ matrix.ad }}
          path: ${{ matrix.cikti }}
          if-no-files-found: error
          retention-days: 14

  # Yayın: etiketi ve GitHub Release'i Actions oluşturuyor.
  #
  # Neden gerekli: uygulamanın sürüm denetimi `releases/latest` ucundan okuyor
  # (bkz. src-tauri/src/update.rs). Koşu çıktıları (`upload-artifact`) o uca
  # girmiyor ve 14 günde siliniyor, yani yayın olmadan bildirim hiç çalışmıyor.
  # Uygulama içinden kurulum da aynı yayının `latest.json` dosyasını okuyor
  # (`releases/latest/download/latest.json`, tauri.conf.json).
  #
  # ## Etiket neden burada oluşuyor
  #
  # Eskiden yayın yalnızca elle itilen `v*` etiketiyle başlıyordu ve etiketi
  # itmek unutuluyordu: 0.2.1 sürüm numarası 2 Eylül'de yazıldı, bir ay
  # boyunca etiketi hiç oluşmadı ve Release çıkmadı. Şimdi kural tek: main'deki
  # sürümün (`package.json`) etiketi yoksa, testler ve iki platformun paketleri
  # geçtikten SONRA bu iş etiketi o commit'te oluşturup paketleri ona bağlıyor.
  # Yeni bir yayın = sürüm numarasını yükseltip main'e itmek. Etiket zaten
  # varsa (sürüm yükseltilmedi) iş hiçbir şey yayınlamıyor.
  #
  # Sürüm üç dosyada (Cargo.toml, package.json, tauri.conf.json) ve aynı olmak
  # zorunda: uygulama kendi sürümünü Cargo'dan okuyup Release etiketiyle
  # karşılaştırıyor, ayrışırsa her açılışta "yeni sürüm var" der. Bunu
  # `releaseVersion.test.ts` bağlıyor; o test arayüz işinde, yani yayından önce.
  #
  # Etiketi `gh release create --target` oluşturuyor (API üzerinden, `git push`
  # yok). İş akışının kendi jetonuyla oluşan etiket YENİ bir koşu tetiklemiyor
  # (GitHub kuralı), yani aynı sürüm iki kez yayınlanmıyor.
  #
  # Elle itilen `v*` etiketi de çalışıyor; ama etiket sürümle eşleşmiyorsa iş
  # DURUYOR: `v0.3.0` etiketine 0.2.1 paketleri bağlamak uygulamanın sürüm
  # denetimini bozardı (paket kendini hep eski sanır).
  yayin:
    name: Yayın
    needs: paket
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Varsayılan `contents: read`; etiket ve Release oluşturmak yazma izni istiyor.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Sürüm ve etiket
        id: surum
        run: |
          surum=$(node -p "require('./package.json').version")
          etiket="v$surum"
          echo "etiket=$etiket" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "$GITHUB_REF_NAME" != "$etiket" ]]; then
              echo "::error::Etiket $GITHUB_REF_NAME ama uygulamanın sürümü $surum — yayın yapılmadı."
              exit 1
            fi
            echo "yayinla=evet" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/$etiket" > /dev/null; then
            echo "::notice::$etiket zaten var — sürüm yükseltilmediği için yayın yok."
            echo "yayinla=hayir" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$etiket yok — bu commit'te oluşturulup yayınlanacak."
            echo "yayinla=evet" >> "$GITHUB_OUTPUT"
          fi

      - name: Paketleri indir
        if: steps.surum.outputs.yayinla == 'evet'
        uses: actions/download-artifact@v8
        with:
          pattern: nterminal-*
          path: indirilen
          merge-multiple: true

      # Paketler platform klasörlerinde geliyor (`nsis/`, `msi/`, `macos/`…).
      # ÖLÇÜLEN HATA: Release adımı main'deki her koşuda düştü ve 0.2.1 hiç
      # yayımlanmadı. Sebep doğrudan yüklenen `paketler/*`in bu klasörleri de
      # yakalaması: `gh` klasörü dosya sanıp yüklemeye çalışıyor (kaynağında
      # dizin denetimi yok), taslağı silip çıkıyor. Betik yalnızca dosyaları
      # düz bir klasöre alıyor, beklenen her paketin yerinde olduğunu
      # denetliyor ve imzalar varsa `latest.json`ı yazıyor (bkz.
      # scripts/release-files.mjs).
      - name: Yayın dosyalarını hazırla
        if: steps.surum.outputs.yayinla == 'evet'
        env:
          ETIKET: ${{ steps.surum.outputs.etiket }}
        run: node scripts/release-files.mjs indirilen paketler "$ETIKET"

      # `--target`: etiket yoksa bu commit'te oluşturuluyor; elle itilmiş
      # etikette zaten var ve aynı commit'i gösteriyor. `--generate-notes`
      # notları bir önceki etiketten bu yana gelen commit'lerden üretiyor;
      # `--notes` onların BAŞINA ekleniyor: Release sayfasından indiren kişi
      # ilk açılışta ne yapacağını (macOS'ta "Yine de Aç", Windows'ta
      # SmartScreen) README'nin kurulum bölümünde buluyor. Tek satır, çünkü
      # aynı metin uygulamanın Hakkında bölümünde sürüm notu olarak da görünüyor.
      - name: Etiket ve Release oluştur
        if: steps.surum.outputs.yayinla == 'evet'
        env:
          GH_TOKEN: ${{ github.token }}
          ETIKET: ${{ steps.surum.outputs.etiket }}
        run: |
          gh release create "$ETIKET" \
            --target "$GITHUB_SHA" \
            --title "$ETIKET" \
            --notes "İlk kurulum (macOS'ta Yine de Aç, Windows'ta SmartScreen): https://github.com/${GITHUB_REPOSITORY}#paketi-indirip-kurmak" \
            --generate-notes \
            paketler/*
